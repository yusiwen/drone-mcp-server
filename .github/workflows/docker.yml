name: Docker

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0, v0.1.0, etc.
  workflow_dispatch:

# Least privilege by default. Jobs below elevate only what they genuinely need.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read   # actions/checkout
      packages: write  # required to push the image to ghcr.io

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}

      - name: Get version info
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # For tags, use the full tag name (including 'v' prefix if present)
            VERSION=${GITHUB_REF#refs/tags/}
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          else
            # For non-tag builds, use dev-<commit>
            COMMIT=$(git rev-parse --short HEAD)
            echo "VERSION=dev-$COMMIT" >> $GITHUB_OUTPUT
          fi
          echo "COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.VERSION }}
            BUILD_COMMIT=${{ steps.version.outputs.COMMIT }}
            BUILD_DATE=${{ steps.version.outputs.BUILD_DATE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          # This job only holds contents: read, so it must not try to attach the
          # SBOM to a GitHub release (that would need contents: write). The SBOM
          # is still uploaded as a workflow artifact.
          upload-release-assets: false

      # Anchore's scan-action is replaced by a pinned grype invocation: the
      # scanner version and checksum are explicit, and the exact command can be
      # reproduced locally when the gate fails.
      - name: Vulnerability scan
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          GRYPE_VERSION=v0.119.0
          GRYPE_SHA256=3fa2dc4b924621ab65404cf08d0b8438d896d80ab949c9d5a4ca283c36004c9b
          ASSET="grype_${GRYPE_VERSION#v}_linux_amd64.tar.gz"

          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --output "${ASSET}" \
            "https://github.com/anchore/grype/releases/download/${GRYPE_VERSION}/${ASSET}"

          echo "${GRYPE_SHA256}  ${ASSET}" | sha256sum --check --strict
          tar --extract --gzip --file "${ASSET}" grype
          rm -f "${ASSET}"
          ./grype --version

          # Fail only on critical findings. The JSON report is uploaded by the
          # next step, which also runs when this one fails.
          ./grype "registry:${REGISTRY}/${IMAGE_NAME}:latest" \
            -o table -o json=grype-report.json --fail-on critical

      - name: Upload the vulnerability report
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grype-report
          path: grype-report.json
          if-no-files-found: ignore
